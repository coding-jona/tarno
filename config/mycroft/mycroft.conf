{
  "lang": "de-de",
  "system_unit": "metric",
  "time_format": "full",
  "date_format": "DMY",
  "opt_in": false,
  "confirm_listening": true,
  "log_level": "INFO",
  "data_dir": "~/.local/share/mycroft",
  "cache_dir": "~/.cache/mycroft",
  "config_dir": "~/.config/mycroft",
  "debug": false,
  "enclosure": {
    "platform": "jarvis"
  },
  "location": {
    "city": {
      "code": "Berlin",
      "name": "Berlin",
      "state": {
        "code": "BE",
        "name": "Berlin",
        "country": {
          "code": "DE",
          "name": "Germany"
        }
      }
    },
    "coordinate": {
      "latitude": 52.52,
      "longitude": 13.405
    },
    "timezone": {
      "code": "Europe/Berlin",
      "name": "Europe/Berlin",
      "offset": 1
    }
  },
  "stt": {
    "module": "faster_whisper",
    "faster_whisper": {
      "model": "small",
      "language": "de",
      "device": "cpu",
      "compute_type": "int8",
      "vad_filter": true
    }
  },
  "tts": {
    "module": "piper",
    "piper": {
      "voice": "de_DE-thorsten-medium",
      "length_scale": 1.0,
      "noise_scale": 0.667,
      "noise_w": 0.8
    }
  },
  "hotwords": {
    "jarvis": {
      "module": "porcupine",
      "porcupine": {
        "keyword": "jarvis",
        "sensitivity": 0.5
      }
    }
  },
  "intents": {
    "persona": {
      "handle_fallback": true,
      "default_persona": "JARVIS",
      "short-term-memory": true,
      "personas_path": "~/.config/ovos_persona"
    },
    "pipeline": [
      "stop_high",
      "converse",
      "padatious_high",
      "adapt_high",
      "ovos-persona-pipeline-plugin-high",
      "fallback_high",
      "adapt_medium",
      "padatious_medium",
      "fallback_medium",
      "ovos-persona-pipeline-plugin-low",
      "fallback_low"
    ]
  },
  "websocket": {
    "host": "127.0.0.1",
    "port": 8181,
    "route": "/core"
  },
  "ssl": false,
  "skills": {
    "directory": "~/.local/share/mycroft/skills",
    "auto_reload": true
  }
}
