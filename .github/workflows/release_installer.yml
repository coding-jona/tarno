name: Release TARNO Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run core tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s workspace/debug/tests

      - name: Run installer tests
        run: python -m unittest discover -s workspace/debug/installer/tests

      - name: Build Public Edition
        run: |
          python -m workspace.debug.installer.pipeline.build_all --edition public --version ${{ github.ref_name || inputs.version }}

      - name: Build Developer Edition
        run: |
          python -m workspace.debug.installer.pipeline.build_all --edition developer --version ${{ github.ref_name || inputs.version }}

      - name: Sign installers (if certificate configured)
        env:
          CODESIGN_CERT: ${{ secrets.CODESIGN_CERT }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          python workspace/debug/installer/scripts/sign_installer.py --version ${{ github.ref_name || inputs.version }}

      - name: Generate checksums
        run: |
          python workspace/debug/installer/scripts/checksums.py --version ${{ github.ref_name || inputs.version }} --output workspace/debug/installer/dist/artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tarno-installers
          path: workspace/debug/installer/dist/artifacts/**

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            workspace/debug/installer/dist/artifacts/TARNO_Setup_*/TARNO_Setup_*.exe
            workspace/debug/installer/dist/artifacts/TARNO_Setup_*/install-info.json
            workspace/debug/installer/dist/artifacts/SHA256SUMS.txt
