name: TARNO CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-only: TARNO's WinUI3 frontend + pywin32/comtypes/pycaw COM
        # integration make it a Windows-only product. vosk (requirements.txt)
        # also ships no macOS wheels for the pinned version, and PyAudio has
        # no Linux wheels at all (would need portaudio19-dev + a build step),
        # so testing on ubuntu-latest/macos-latest wasn't meaningfully
        # covering anything real anyway.
        os: [windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check src/tarno_backend workspace/debug/tests || true

      - name: Run unit tests
        env:
          PYTHONPATH: src
        # pytest instead of `python -m unittest discover`: some test files
        # (test_language_swap.py, test_workspace_resolver.py) are written
        # as bare pytest-style functions/fixtures, not unittest.TestCase
        # subclasses - unittest's discovery only collects TestCase classes,
        # so those files silently never ran under discover. pytest collects
        # both styles. requirements-dev.txt (installed above) already
        # includes pytest, so this needs no extra install step.
        run: pytest workspace/debug/tests

      - name: Compile package
        run: python -m py_compile src/tarno_backend/**/*.py
        shell: bash
